# cargo deny: what CI refuses in Kea's dependency tree. Run `cargo deny check`.

[advisories]
# Any advisory fails CI unless it is listed here with the reason it cannot reach Kea.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint comes only through elliptic-curve, an optional dependency no Kea crate enables; it is never compiled." },
  { id = "RUSTSEC-2026-0543", reason = "chrono comes only through serde_with's optional chrono feature, which no Kea crate enables; it is never compiled." },
  { id = "RUSTSEC-2024-0388", reason = "derivative comes only through ark-ff, an optional dependency of ruint no Kea crate enables; it is never compiled." },
  { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time macro alloy-primitives uses; it is unmaintained, not vulnerable." },
]

[licenses]
# Permissive licenses only, so anyone can use Kea under MIT or Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
