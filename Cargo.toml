[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/keaproofs/kea"
# The crates are built here, never published to crates.io.
publish = false

[workspace.dependencies]
kea-core = { path = "crates/kea-core" }
kea-chain = { path = "crates/kea-chain" }
kea-sources = { path = "crates/kea-sources" }
kea-prover = { path = "crates/kea-prover" }
kea-claims = { path = "crates/kea-claims" }
kea-engine = { path = "crates/kea-engine" }
alloy-primitives = { version = "1", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.32", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
