name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: musl's C compiler, for the bundled SQLite and ring
        run: sudo apt-get update && sudo apt-get install -y musl-tools file
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin kea --bin kea-api
      - name: Package, once both binaries are static and start
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="kea-$TAG-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/kea" "target/$TARGET/release/kea-api" README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          for bin in kea kea-api; do
            file "$dir/$bin" | grep -q static
            "$dir/$bin" --version
          done
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: kea-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum kea-*.tar.gz > SHA256SUMS
      - name: Build provenance, signed through GitHub
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: The provenance as a release file, so a download can be checked offline
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: jq -c . "$BUNDLE" > "dist/kea-$TAG.intoto.jsonl"
      - name: Notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## ${TAG#v} " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          grep -q . notes.md
          printf '\n%s\n' 'Check a download with `sha256sum --ignore-missing -c SHA256SUMS`, and that GitHub built it from this tag with `gh attestation verify <file> --repo keaproofs/kea`.' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Kea ${TAG#v}" --notes-file notes.md --verify-tag
