name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: GNU time, which the prover's resource caps use
        run: sudo apt-get update && sudo apt-get install -y time
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release --locked -- -D warnings
      - run: cargo test --release --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Advisories, licenses, banned crates and sources
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories bans licenses sources

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in what the site ships
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.10.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test libraries, at the commits the proofs were checked with
        run: |
          fetch() {
            git init -q "lib/$1"
            git -C "lib/$1" fetch -q --depth 1 "https://github.com/$2" "$3"
            git -C "lib/$1" checkout -q FETCH_HEAD
          }
          fetch forge-std foundry-rs/forge-std 15b2df92a05d4d2f76a06653872fefb287e0e01c
          fetch halmos-cheatcodes a16z/halmos-cheatcodes 6da4e692c357ba6d641a2e677a28298cac9f76ab
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      - name: Lint, failing on any warning
        run: forge lint src --deny warnings
      - name: Proof and analysis tools, each pinned by hash
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Kea's own proofs of its bounty pool, burner and splitter
        run: halmos --function check_
      - name: Static analysis, failing on any finding
        run: slither .
