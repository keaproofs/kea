# `cargo audit` reads this. Each entry names an advisory that cannot reach Kea's build, and why.
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint: only through elliptic-curve, an optional dependency no Kea crate enables; never compiled.
  "RUSTSEC-2024-0388", # derivative: only through ark-ff, an optional dependency of ruint no Kea crate enables; never compiled.
  "RUSTSEC-2024-0436", # paste: a compile-time macro alloy-primitives uses; unmaintained, not vulnerable.
]
