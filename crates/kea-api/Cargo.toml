[package]
name = "kea-api"
description = "HTTP API for Kea: ask about a contract, follow the job, read the report, embed the badge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kea-api"
path = "src/main.rs"

[dependencies]
alloy-primitives.workspace = true
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
kea-chain.workspace = true
kea-claims.workspace = true
kea-core.workspace = true
kea-engine.workspace = true
kea-sources.workspace = true
regex.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
