# For the server block in /etc/nginx/sites-available/kea, above `location /`. Then: nginx -t && systemctl reload nginx
#
# /data/ serves kea-burns' JSON from its state directory, outside the web root: deploys run rsync --delete on
# /var/www/kea, and `location /` answers a missing file there with index.html and a 200. Here a missing file is a 404,
# and nginx's ETags turn most of the page's polls into 304s. ^~ keeps any regex location added later (a cache rule
# for .json, say) from taking /data/ away from this alias.
location ^~ /data/ {
    alias /var/lib/kea-burns/;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# The burn page's own HTML build input, for its own title and share card, once a build ships burn.html. Until then
# /burn gets index.html, as it does through `location /` today, so the share URL never answers 404. Its headers are
# those of `location /`, so a browser never keeps a burn.html whose assets a deploy has removed.
location = /burn {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files /burn.html /index.html;
}

# /burn/ would fall through to `location /` and get index.html, with no share card: send it to the one URL.
location = /burn/ {
    return 301 /burn;
}
